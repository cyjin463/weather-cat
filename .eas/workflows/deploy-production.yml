name: Deploy Production

on:
  push:
    branches: ['main']

jobs:
  fingerprint:
    type: fingerprint
    environment: production

  get_android_build:
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      profile: production

  build_android:
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: production

  # Play 자동 제출: Expo 대시보드 → Credentials → Google Service Account JSON 업로드 후 활성화
  # submit_android:
  #   needs: [build_android]
  #   type: submit
  #   params:
  #     profile: production
  #     build_id: ${{ needs.build_android.outputs.build_id }}

  publish_update:
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id }}
    type: update
    params:
      channel: production
      platform: android
